<title>Chân dung khách Kangnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Hệ token dùng chung với báo cáo KNB hiện hành — cùng một gia đình hình thức,
   thêm 4 màu bậc A/B/C/D cho khối chấm điểm. */
:root{
  --bg:#f5f4f0; --card:#fff; --ink:#1f1e1b; --mute:#6a675f; --line:#e3e0d8; --chip:#efece5;
  --acc:#7a4f26; --acc-ink:#fff;
  --ok:#2d7a4c; --mid:#a77b1f; --bad:#b03a3a; --hl:#f3d34a; --hl-ink:#1f1e1b;
  --hot:#c0462f; --warm:#d39a2c; --cold:#c9c4b8;
  --bA:#2d7a4c; --bB:#3f6f8f; --bC:#a77b1f; --bD:#b03a3a;
  --f:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161614; --card:#1f1f1c; --ink:#ebe9e3; --mute:#a29f97; --line:#34322d; --chip:#2a2925;
  --acc:#d5a370; --acc-ink:#1a1611;
  --ok:#5dbd85; --mid:#d8ac55; --bad:#e26d6d; --hl:#d9b93a; --hl-ink:#1a1611;
  --hot:#e2725c; --warm:#d8ac55; --cold:#4a4740;
  --bA:#5dbd85; --bB:#7fb0d4; --bC:#d8ac55; --bD:#e26d6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161614; --card:#1f1f1c; --ink:#ebe9e3; --mute:#a29f97; --line:#34322d; --chip:#2a2925;
  --acc:#d5a370; --acc-ink:#1a1611;
  --ok:#5dbd85; --mid:#d8ac55; --bad:#e26d6d; --hl:#d9b93a; --hl-ink:#1a1611;
  --hot:#e2725c; --warm:#d8ac55; --cold:#4a4740;
  --bA:#5dbd85; --bB:#7fb0d4; --bC:#d8ac55; --bD:#e26d6d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f);margin:0}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 64px;
      padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:30px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line);
  font-weight:600;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;background:var(--acc);border-radius:2px;flex:none}
h2.top{margin-top:14px}
h3{font-size:14.5px;margin:0 0 6px;font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.picker{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.picker select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:200px}
select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.alerts{display:grid;gap:6px}
.alert{border:1px solid var(--line);border-left:4px solid var(--mid);background:var(--card);
  border-radius:8px;padding:8px 12px;font-size:13px}
.alert.bad{border-left-color:var(--bad)}
details.fold{margin:8px 0}
details.fold>summary{cursor:pointer;color:var(--acc);font-size:13.5px;font-weight:600;
  list-style:none;display:flex;gap:6px;align-items:baseline;padding:4px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▶";font-size:10px;display:inline-block;transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary .cnt{color:var(--mute);font-weight:400;font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;
  display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{color:var(--mute);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:600}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15;margin:1px 0}
.kpi .s{color:var(--mute);font-size:12px}
.kpi.canh{border-left:4px solid var(--bad)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
/* Thẻ insight đọc chứ không lướt — để 2 cột cho dòng dài thở được,
   ⛔ không dùng .g2 vì auto-fit sẽ tự chẻ thành 3 cột trên màn rộng. */
.g-ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.g-ins{grid-template-columns:minmax(0,1fr)}}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:860px){.cols2{grid-template-columns:minmax(0,1fr)}}

.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500;
  background:var(--chip);margin:0 4px 4px 0;white-space:nowrap}
.tag.wrap{white-space:normal}
.t-bad{background:var(--bad);color:#fff}.t-mid{background:var(--mid);color:#fff}
.t-ok{background:var(--ok);color:#fff}.t-acc{background:var(--acc);color:var(--acc-ink)}
.note{font-size:12px;color:var(--mute)}
.nb{margin-bottom:8px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px;position:sticky;
  top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.tbl.flat{border:0;border-radius:0;background:transparent}
.tbl.flat th{background:transparent}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--chip);font-weight:700;white-space:nowrap;font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--mute);
  border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--chip) 36%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--acc) 7%,transparent)}
tbody tr.pick td{background:color-mix(in srgb,var(--hl) 17%,transparent)}
.dim{color:var(--mute)}

.bar{display:inline-block;width:70px;height:6px;background:var(--chip);border-radius:3px;
  vertical-align:middle;margin-left:6px}
.bar i{display:block;height:6px;border-radius:3px}
.b-ok{background:var(--ok)}.b-mid{background:var(--mid)}.b-bad{background:var(--bad)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 46px 84px;gap:8px;align-items:center;
  padding:3px 0;font-size:13px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.hbar .bar{width:84px;margin:0}

.mix{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 96px;gap:8px;align-items:center;
  font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.mix:last-of-type{border-bottom:0}
.mix .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mix .stk{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--chip)}
.mix .stk i{display:block;height:12px}
.mix .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.i-hot{background:var(--hot)}.i-warm{background:var(--warm)}.i-cold{background:var(--cold)}

/* thẻ vấn đề — sọc mức nặng bên trái, không phải thẻ bo tròn giống nhau */
.issue{display:grid;gap:6px;align-content:start;border-left:4px solid var(--line)}
.issue.sev-nghiem_trong{border-left-color:var(--bad)}
.issue.sev-nang{border-left-color:var(--mid)}
.issue .rank{font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mute);font-weight:700}
.issue h3{margin-top:2px}

/* chấm điểm */
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.band{border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;
  padding:10px 12px;background:var(--card)}
.band b{font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.band.A{border-top-color:var(--bA)}.band.B{border-top-color:var(--bB)}
.band.C{border-top-color:var(--bC)}.band.D{border-top-color:var(--bD)}
.band .l{font-size:12px;color:var(--mute)}
.crit{display:grid;grid-template-columns:52px minmax(0,1fr) 54px 84px;gap:8px;align-items:center;
  padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.crit:last-child{border-bottom:0}
.crit .ma{font-weight:600;font-variant-numeric:tabular-nums}
.crit .v{text-align:right;font-variant-numeric:tabular-nums}
.crit .bar{width:84px;margin:0}
/* thanh bộ lọc bảng — dùng lại .picker của chọn kỳ cho cùng một hình thức */
.loc{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:0 0 10px}
.loc .picker select{min-width:160px}
.loc .picker:has(select:disabled) select{opacity:.6;cursor:not-allowed}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
tr[hidden]{display:none}
.fm-ds{display:grid;gap:2px;min-width:150px;max-width:260px;font-size:12.5px}
.nw{white-space:nowrap}
.lock{padding:24px 18px;text-align:center;color:var(--mute);border:1px dashed var(--line);
  border-radius:10px;background:color-mix(in srgb,var(--chip) 40%,transparent);line-height:1.6}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
ul.plain,ol.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.sub2{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);
  font-weight:700;margin:12px 0 5px}
.card h3{font-size:14px}
.bands{margin-bottom:2px}
.band .l{letter-spacing:.03em}
.ev{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding:3px 0 3px 9px;
  margin:5px 0;overflow-wrap:anywhere;line-height:1.55}
/* Thẻ insight chia thành Ô, không phải một dải văn bản liền.
   Nửa trên = HIỂU khách. Nửa dưới = LÀM gì, có rail màu để tách hẳn ra. */
.card.ins{padding:0;overflow:hidden}
.ins .hd{padding:13px 14px 11px;background:var(--chip);border-bottom:1px solid var(--line)}
.ins .hd h3{margin:4px 0 5px;font-size:15px;line-height:1.3}
.ins .sec{padding:10px 14px}
.ins .sec + .sec{border-top:1px solid var(--line)}
.ins .sec.do{border-left:3px solid var(--acc)}
.ins .sec.no{border-left:3px solid var(--bad)}
.ins .sec.no .lab{color:var(--bad)}
.ins .sec.no li::marker{color:var(--bad)}
.ins .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  font-weight:700;margin:0 0 5px}
.ins p{margin:0;font-size:13.5px;white-space:pre-line}
.ins ul,.ins ol{margin:0;padding-left:17px;display:grid;gap:4px}
.ins ol{padding-left:21px}
.ins li{font-size:13.5px;line-height:1.5}
.ins ul li::marker{color:var(--mute)}
.ins ol li::marker{color:var(--acc);font-weight:600}
.ins .q{font-size:13.5px;line-height:1.5;margin:3px 0;padding:2px 0 2px 10px;
  border-left:2px solid var(--acc)}
.ins .sec.do .q{border-left:0;padding-left:0}
.ins .ev{margin:0;padding:10px 14px;border-left:0;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--chip) 45%,transparent)}
.win{display:grid;grid-template-columns:34px minmax(0,1fr) 64px;gap:8px;align-items:center;
  padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.win:last-of-type{border-bottom:0}
.win .r{font-weight:700;font-variant-numeric:tabular-nums;text-align:center;
  border-radius:6px;padding:2px 0;background:var(--chip)}
.win.top .r{background:var(--acc);color:var(--acc-ink)}
.win .d{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:600px){
  h1{font-size:19px}.kpi b{font-size:19px}.picker,.picker select{width:100%;min-width:0}
  .mix{grid-template-columns:minmax(0,110px) minmax(0,1fr) 80px}
  .crit{grid-template-columns:46px minmax(0,1fr) 46px 60px}.crit .bar{width:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap" id="app"><div class="loading">Đang tải báo cáo…</div></div>

<!-- Bản một kỳ (dự phòng): tools/id.py có thể nhúng JSON vào đây.
     Để trống thì trang đọc data/index.json — link cố định, xem được nhiều kỳ.
     Schema: insight-dashboard-kangnam/1 -->
<script type="application/json" id="kn-data"></script>

<script>
(function(){
"use strict";
var app=document.getElementById('app');

/* ───────── định dạng ───────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v,d){return v==null||v===''?'—':Number(v).toLocaleString('vi-VN',
  {maximumFractionDigits:d==null?1:d,minimumFractionDigits:0})}
function pct(v){return v==null?'—':num(v,1)+'%'}
function k(v){return v==null?'<span class="dim">—</span>':num(Math.round(v/1000),0)}
function find(a,key,val){if(!a)return null;for(var i=0;i<a.length;i++)if(a[i][key]===val)return a[i];return null}
function objList(o){if(!o)return[];if(Array.isArray(o))return o;
  return Object.keys(o).map(function(x){return{nhan:x,so:o[x]}}).sort(function(a,b){return (b.so||0)-(a.so||0)})}

function delta(cur,prev,kieu,tot){
  if(cur==null||prev==null)return '<span class="dim" style="font-size:12px">kỳ trước —</span>';
  var x=cur-prev; if(Math.abs(x)<1e-9)return '<span class="dim" style="font-size:12px">= kỳ trước</span>';
  var tot_hon=(tot==='thap')?x<0:x>0;
  var v=kieu==='pct'?num(Math.abs(x),1)+' điểm':num(Math.abs(x),0);
  return '<span style="font-size:12px;font-variant-numeric:tabular-nums;color:'+
    (tot?(tot_hon?'var(--ok)':'var(--bad)'):'var(--mute)')+'">'+(x>0?'▲':'▼')+' '+v+'</span>';
}
function barCls(v,chuan){if(v==null)return 'b-mid';var c=chuan||70;
  return v>=c?'b-ok':(v>=c*0.6?'b-mid':'b-bad')}
function bar(v,chuan){if(v==null)return '';
  return '<span class="bar" aria-hidden="true"><i class="'+barCls(v,chuan)+
    '" style="width:'+Math.max(0,Math.min(100,v))+'%"></i></span>'}
function t(rows,head,cls,id){
  return '<div class="tbl'+(cls?' '+cls:'')+'"><table'+(id?' id="'+id+'"':'')+'><thead><tr>'+head.map(function(h){
    return '<th'+(h.c?' class="'+h.c+'"':'')+'>'+esc(h.l)+'</th>'}).join('')+'</tr></thead><tbody>'+
    (rows.length?rows.join(''):'<tr><td colspan="'+head.length+'" class="empty">Không có dữ liệu kỳ này</td></tr>')+
    '</tbody></table></div>'}
function td(v,c){return '<td'+(c?' class="'+c+'"':'')+'>'+v+'</td>'}
function hbars(list,tong){
  list=objList(list); if(!list.length)return '<div class="note">—</div>';
  var mx=tong||Math.max.apply(null,list.map(function(x){return x.so||0}))||1;
  return list.map(function(x){
    return '<div class="hbar"><span>'+esc(x.nhan)+'</span><b>'+num(x.so,0)+
      '</b><span class="bar" aria-hidden="true"><i class="b-mid" style="width:'+
      ((x.so||0)/mx*100)+'%"></i></span></div>'}).join('')}
function fold(title,cnt,body,open){
  return '<details class="fold"'+(open?' open':'')+'><summary>'+esc(title)+
    (cnt?' <span class="cnt">'+esc(cnt)+'</span>':'')+'</summary><div>'+body+'</div></details>'}
function bullets(a){return '<ul class="plain">'+(a||[]).map(function(x){
  return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}

var SEV={nghiem_trong:['nghiêm trọng','t-bad'],nang:['nặng','t-mid'],nhe:['nhẹ','']};
var NHAN={da_do:['đã đo','t-ok'],gia_thuyet:['giả thuyết','t-mid']};
function chip(map,key){var x=map[key]||[key,''];return key?'<span class="tag '+x[1]+'">'+esc(x[0])+'</span>':''}

function vanDe(arr,title,top){
  arr=arr||[];
  return '<h2'+(top?' class="top"':'')+'>'+esc(title||'Vấn đề cốt lõi')+'</h2>'+
    (arr.length?'<div class="g3">'+arr.map(function(x,i){
      var s=SEV[x.muc]||['',''];
      return '<div class="card issue sev-'+esc(x.muc)+'"><div class="rank">#'+(i+1)+
        (x.anh_huong!=null?' · ảnh hưởng '+num(x.anh_huong,0)+' HT':'')+'</div><div>'+
        '<span class="tag '+s[1]+'">'+s[0]+'</span>'+chip(NHAN,x.nhan_do)+'</div><h3>'+esc(x.tieu_de)+'</h3>'+
        '<div><b>Số liệu:</b> '+esc(x.so_lieu)+'</div><div><b>Đề xuất:</b> '+esc(x.de_xuat)+'</div>'+
        '<div class="note">Người làm: '+esc(x.so_huu||'—')+'</div></div>'}).join('')+'</div>'
     :'<div class="card empty">Agent chưa ghi vấn đề cốt lõi cho khối này</div>')}

/* ───────── đầu trang ───────── */
function header(D,ky_ds,id){
  var ky=D.ky||{},sel='';
  if(ky_ds&&ky_ds.length>1)sel='<label class="picker" for="ky-select">Kỳ báo cáo<select id="ky-select">'+
    ky_ds.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===id?' selected':'')+'>'+
      esc(p.nhan)+'</option>'}).join('')+'</select></label>';
  var meta=['Kỳ '+esc(ky.nhan||''),ky.tao?'tạo '+esc(ky.tao):'',ky.nguon?'nguồn '+esc(ky.nguon):'']
    .filter(Boolean).join(' · ');
  var L=bc();
  return '<div class="head"><div><h1>'+esc(L.ten)+'</h1>'+
    '<div class="sub">'+(L.phu?esc(L.phu)+'<br>':'')+meta+
    '<br>Tiền: nghìn đồng · phân loại tự động bằng tools/id.py, chưa qua người soát</div>'+
    '</div>'+sel+'</div>'}

function canhBao(D){
  var a=(D.canh_bao||[]).map(function(x){
    return '<div class="alert'+(x.muc==='bad'?' bad':'')+'">'+esc(x.text||x)+'</div>'});
  var h=a.length?fold(a.length+' lưu ý dữ liệu','','<div class="alerts">'+a.join('')+'</div>'):'';
  /* Bố cục bỏ tab Ghi chú dữ liệu thì ghi chú vẫn phải ở lại: báo cáo không nói được
     số đến từ đâu thì không ai dám dùng để ra quyết định (id-J §1). Đưa vào ô gập. */

/* Thân một ô của thẻ insight: dòng mở đầu "- " thành <li>, còn lại thành đoạn.

function insBody(v){
  var ra='',li=[];
  function xa(){
    if(!li.length)return;
    var so=li.every(function(x){return /^\d+\.\s/.test(x)});   // thứ tự → <ol> thật
    ra+=so?'<ol>'+li.map(function(x){return '<li>'+esc(x.replace(/^\d+\.\s*/,''))+'</li>'}).join('')+'</ol>'
          :'<ul>'+li.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    li=[]}
  String(v||'').split('\n').forEach(function(d){
    d=d.replace(/\s+$/,'');
    if(!d.trim())return;
    if(d.indexOf('- ')===0){li.push(d.slice(2).trim());return}
    xa();
    // '» ' = lời thoại mẫu / câu của khách — tách hẳn khỏi gạch đầu dòng
    if(d.indexOf('» ')===0)ra+='<div class="q">'+esc(d.slice(2).trim())+'</div>';
    else ra+='<p>'+esc(d.trim())+'</p>'});
  xa(); return ra}

/* ───────── ⑦ Ngân hàng hook ───────── */
/* 16 format L01–L16 của id-H §2 — bảng tra để bảng hook hiện TÊN format,
   ⛔ không bắt người đọc nhớ mã. L13–L16 chưa ai viết định nghĩa (id-H §2). */
var TEN_FM={
  L01:['Bác sĩ — Talk hỏi đáp','25–35s'],      L02:['Bác sĩ — Talk chủ đề','40–60s'],
  L03:['Bác sĩ — Phân tích ca thật','30–45s'], L04:['Khách hàng — Trước/sau','10–15s'],
  L05:['Khách hàng — Biến đổi theo mốc ngày','15–25s'], L06:['Khách hàng — Review','0–45s'],
  L07:['Khách hàng — Hành trình 1 ngày','45–90s'], L08:['Khách hàng — Kết quả','20–35s'],
  L09:['Dịch vụ — Công nghệ','15–30s'],        L10:['Dịch vụ — Quy trình','25–40s'],
  L11:['Dịch vụ — Giá / chính sách','10–20s'], L12:['Local — Cơ sở · bác sĩ · công nghệ','20–35s'],
  L13:['⚠ chưa có định nghĩa format','—'],L14:['⚠ chưa có định nghĩa format','—'],
  L15:['⚠ chưa có định nghĩa format','—'],L16:['⚠ chưa có định nghĩa format','—']};

/* Nấc 5A đọc theo tầng phễu cho khối nội dung: A1 đầu phễu, A2–A3 giữa, A4 cuối,
   A5 là sau bán. ⛔ Không đổi tên nấc trong dữ liệu — chỉ đổi cách hiện. */
var GIAI_DOAN={A1:'A1 · TOF',A2:'A2 · MOF',A3:'A3 · MOF',A4:'A4 · BOF',A5:'A5 · sau bán'};

/* Dịch vụ trong line Da. Dòng hook khai sẵn `dich_vu` thì lấy nguyên; chưa khai thì
   suy từ chữ trong hook — cùng lối từ khoá của tools/id.py, ⛔ số máy xếp chưa người soát. */
var DV_TU=[
  ['Nám · tàn nhang',['nám','tàn nhang','đốm nâu','sạm']],
  ['Mụn · thâm · lỗ chân lông',['mụn','thâm','lỗ chân lông','sẹo rỗ']],
  ['Tiêm — filler · botox',['tiêm','filler','botox','ấn đường','rãnh cười','thái dương']],
  ['Trẻ hoá · nâng cơ',['trẻ hoá','trẻ hóa','nâng cơ','chảy xệ','nhăn','hifu','thermage','lão hoá','lão hóa']],
  ['Trắng da',['trắng da','tắm trắng','bật tông']],
  ['Sẹo',['sẹo']]];
function suyDichVu(r,ten){
  var s=((r.hook||'')+' '+(r.insight||'')+' '+(ten||'')).toLowerCase();
  for(var i=0;i<DV_TU.length;i++)for(var j=0;j<DV_TU[i][1].length;j++)
    if(s.indexOf(DV_TU[i][1][j])>=0)return DV_TU[i][0];
  return '(chưa nêu)'}

/* Lọc TẠI CHỖ bằng data-* trên từng dòng — ⛔ không render lại cả trang,
   render lại là mất tab và kỳ đang xem. */
function locHook(){
  var box=document.getElementById('hook-loc'); if(!box)return;
  var g={};
  box.querySelectorAll('select').forEach(function(s){if(!s.disabled)g[s.dataset.truong]=s.value});
  var hien=0,tong=0;
  app.querySelectorAll('#hook-bang tbody tr[data-loc]').forEach(function(tr){
    tong++;
    var ok=Object.keys(g).every(function(f){return !g[f]||tr.dataset[f]===g[f]});
    tr.hidden=!ok; if(ok)hien++});
  var d=document.getElementById('hook-dem');
  if(d)d.textContent=(hien===tong?num(tong,0)+' hook':num(hien,0)+'/'+num(tong,0)+' hook');
  var e=document.getElementById('hook-rong'); if(e)e.hidden=hien>0}

/* Ba bộ lọc: dịch vụ · tuyến nội dung · nhân viên. Trường nào dữ liệu chưa khai thì
   select khoá lại và nói rõ cần khai trường gì — ⛔ không ẩn đi như thể không có yêu cầu. */
function locHookBar(ds){
  var F=[{k:'dv',l:'Dịch vụ',truong:'dich_vu'},
         {k:'tuyen',l:'Tuyến nội dung',truong:'tuyen'},
         {k:'nhanvien',l:'Nhân viên',truong:'nhan_vien'}];
  return '<div class="loc" id="hook-loc">'+F.map(function(f){
    var dem={},co=0;
    ds.forEach(function(x){var v=x[f.k]; if(v){dem[v]=(dem[v]||0)+1;co++}});
    var ks=Object.keys(dem).sort();
    if(!ks.length)return '<label class="picker"><span>'+esc(f.l)+'</span>'+
      '<select data-truong="'+f.k+'" disabled><option>chưa có dữ liệu</option></select>'+
      '<span class="note">dòng hook chưa khai <code>'+esc(f.truong)+'</code></span></label>';
    return '<label class="picker"><span>'+esc(f.l)+'</span><select data-truong="'+f.k+'">'+
      '<option value="">Tất cả · '+num(co,0)+' hook</option>'+ks.map(function(v){
        return '<option value="'+esc(v)+'">'+esc(v)+' · '+num(dem[v],0)+'</option>'}).join('')+
      '</select></label>'}).join('')+
    '<button type="button" class="btn" id="hook-xoa">Xoá lọc</button></div>'}

/* Kế hoạch theo chân dung — khối đọc TRƯỚC bảng hook: kỳ này chọn chân dung nào,
   insight cốt lõi là gì, và phải cầm PROOF gì trong tay rồi mới được sản xuất.
   ⛔ Chỉ liệt kê chân dung thật sự có hook trong kỳ — không có hook thì không phải kế hoạch. */
function keHoachCD(D,ds){
  var C=D.chan_dung||{},W=C.co_hoi_win||[],ins=C.insight||[],tep=C.tep||[];
  var cds=[];
  ds.forEach(function(x){if(cds.indexOf(x.r.cd)<0)cds.push(x.r.cd)});
  if(!cds.length)return '';
  var dong=cds.map(function(cd){
    var w=find(W,'cd',cd)||{},i=find(ins,'cd',cd)||{},tp=find(tep,'cd',cd)||{},pr=[];
    ds.forEach(function(x){
      if(x.r.cd!==cd||!x.r.ly_do_co)return;
      var s=(x.r.co_phap_che||'')+' '+x.r.ly_do_co;
      if(pr.indexOf(s)<0)pr.push(s)});
    return {cd:cd,ten:i.ten||tp.ten||cd,ins:i.insight||'',proof:i.proof||w.proof||'',ds_proof:pr,
      diem:(w.diem==null?null:w.diem),hang:w.hang,
      so:ds.filter(function(x){return x.r.cd===cd}).length}});
  dong.sort(function(a,b){return (b.diem||0)-(a.diem||0)});
  return '<h2 class="top">Kế hoạch theo chân dung</h2>'+
    '<div class="note nb">'+num(dong.length,0)+' chân dung được chọn, sắp theo điểm Win. '+
    'Mỗi chân dung có một insight cốt lõi và proof bắt buộc phải có trước khi sản xuất. '+
    'Proof gom từ cờ pháp chế của chính các hook bên dưới — khai <code>proof</code> trong thẻ '+
    'insight chân dung thì bảng lấy nguyên.</div>'+
    t(dong.map(function(r){
      return '<tr>'+td('<b>'+esc(r.cd)+'</b>')+
        td('<b>'+esc(r.ten)+'</b><div class="note">'+num(r.so,0)+' hook kỳ này</div>')+
        td(r.ins?'<div class="ins">'+insBody(r.ins)+'</div>':'<span class="dim">—</span>')+
        td(r.proof?'<div class="ins">'+insBody(r.proof)+'</div>':
           (r.ds_proof.length?'<ul class="plain">'+r.ds_proof.map(function(s){
             return '<li>'+esc(s)+'</li>'}).join('')+'</ul>'
            :'<span class="dim">không có cờ pháp chế — sản xuất được ngay</span>'))+
        td(r.diem==null?'<span class="dim">—</span>':'<b>'+num(r.diem,1)+'</b>'+
           (r.hang?'<div class="note">hạng '+esc(r.hang)+'</div>':''),'n')+'</tr>'}),
      [{l:'Mã'},{l:'Chân dung'},{l:'Insight cốt lõi'},{l:'Proof bắt buộc'},{l:'Win',c:'n'}])}

function tabHook(D){
  var H=D.hook||{},M=D.ma_tran||{},C=D.chan_dung||{},tep=C.tep||[],W=C.co_hoi_win||[];
  if(M.trang_thai!=='da_duyet'||!(H.dong||[]).length)
    return '<h2 class="top">Ngân hàng hook</h2><div class="lock">'+
      esc(H.ghi_chu||'chưa viết — ma trận chưa được duyệt')+
      '<div class="note" style="margin-top:10px">Mỗi hook phải gắn 1 chân dung · 1 nấc · 1 phản đối · '+
      '1 HT truy ngược · 3 format. Cột <b>Duyệt</b> do bác sĩ và pháp chế điền, ⛔ agent không tự điền '+
      '(<code>id-H §4</code>).</div></div>';
  var CO={'🔴':['🔴 chặn','t-bad'],'🟡':['🟡 hỏi lại','t-mid'],'🟢':['🟢 sạch','t-ok']};
  /* Gộp sẵn ba khoá lọc cho từng dòng — tên chân dung lấy từ tệp của kỳ, ⛔ không hiện mã trần. */
  var ds=H.dong.map(function(r){
    var cd=find(tep,'cd',r.cd)||{};
    return {r:r, ten:cd.ten||'',
      dv:r.dich_vu||suyDichVu(r,cd.ten),
      tuyen:r.tuyen||r.khoi||'(chưa khai)',
      nhanvien:r.nhan_vien||r.nguoi_viet||r.so_huu||''}});

  /* Bảng gọn 6 cột. Mã O · truy ngược · cờ pháp chế · ô Duyệt ⛔ KHÔNG bị bỏ —
     dồn xuống dòng phụ dưới hook, vì đó là rào an toàn id-H §4 chứ không phải cột trang trí. */
  var head=[{l:'Chân dung'},{l:'Giai đoạn'},{l:'Hook 3 giây'},{l:'CTA cuối'},
    {l:'Format đề xuất'},{l:'Win',c:'n'}];
  var rows=ds.map(function(x){
    var r=x.r,c=CO[r.co_phap_che]||[r.co_phap_che||'—',''],w=find(W,'cd',r.cd)||{};
    var diem=(r.win!=null?r.win:(w.diem!=null?w.diem:null));
    var phu=['Phản đối: '+esc(TEN_O[r.ma_o]||r.ma_o||'—')];
    if(CHAN_O[r.ma_o])phu.push('<span style="color:var(--bad)">'+esc(CHAN_O[r.ma_o])+'</span>');
    phu.push(r.truy_nguoc?esc(r.truy_nguoc):
      '<span style="color:var(--bad)">⛔ truy ngược trống — loại</span>');
    if(x.nhanvien)phu.push('NV: '+esc(x.nhanvien));
    phu.push(r.duyet?'duyệt: '+esc(r.duyet):'chờ BS + pháp chế');
    return '<tr data-loc="1" data-dv="'+esc(x.dv)+'" data-tuyen="'+esc(x.tuyen)+
      '" data-nhanvien="'+esc(x.nhanvien)+'"'+(r.co_phap_che==='🔴'?' class="pick"':'')+'>'+
      td('<b>'+esc(x.ten||r.cd)+'</b>'+
         (x.ten&&r.cd?'<div class="note">'+esc(r.cd)+' · '+esc(x.dv)+'</div>':''))+
      td('<span class="nw">'+esc(GIAI_DOAN[r.nac]||r.nac||'—')+'</span>')+
      td('<span class="tag '+c[1]+'">'+esc(c[0])+'</span>'+
         (r.challenger?'<span class="tag t-acc">challenger</span>':'')+
         '<b>'+esc(r.hook)+'</b>'+
         (r.insight?'<div class="note">'+esc(r.insight)+'</div>':'')+
         (r.ly_do_co?'<div class="note">'+esc(r.ly_do_co)+'</div>':'')+
         '<div class="note">'+phu.join(' · ')+'</div>')+
      td(esc(r.cta))+
      td('<div class="fm-ds">'+(r.fm||[]).map(function(f){
        var n=TEN_FM[f];
        return '<div>'+esc(n?n[0]:f)+
          (n&&n[1]&&n[1]!=='—'?' <span class="dim">'+esc(n[1])+'</span>':'')+'</div>'}).join('')+'</div>')+
      td(diem==null?'<span class="dim">—</span>':
         '<b>'+num(diem,1)+'</b>'+(r.win==null&&w.hang?'<div class="note">hạng '+esc(w.hang)+'</div>':''),'n')+
      '</tr>'});
  rows.push('<tr id="hook-rong" hidden><td colspan="'+head.length+
    '" class="empty">Không hook nào khớp bộ lọc đang chọn</td></tr>');

  var dau=keHoachCD(D,ds);
  return dau+'<h2'+(dau?'':' class="top"')+'>Ngân hàng hook — <span id="hook-dem">'+
    num(H.dong.length,0)+' hook</span></h2>'+
    '<div class="note nb">'+num(H.dong.length,0)+
    ' nội dung: Chân dung → Giai đoạn → Hook → CTA → Format'+
    (H.ghi_chu?'<br>'+esc(H.ghi_chu):'')+'</div>'+locHookBar(ds)+
    '<div class="note nb">Bộ lọc chỉ lọc bảng, ⛔ không đổi số liệu kỳ. '+
    'Dịch vụ suy từ chữ trong hook khi dòng hook chưa khai <code>dich_vu</code>. '+
    '<b>Win</b> là điểm win của chân dung ở tab Chân dung (lead bỏ lỡ × hệ số × tỷ lệ chốt), '+
    '⛔ chưa phải điểm riêng từng hook — khai <code>win</code> trong dòng hook thì bảng lấy số đó.</div>'+
    t(rows,head,null,'hook-bang')+
    ((H.tu_kiem||[]).length?'<h2>Tự kiểm ngân hàng hook — id-H §5</h2><div class="card">'+
      bullets(H.tu_kiem)+'</div>':'')}

/* ───────── ⑧ Sổ tay & việc cần xử lý ───────── */
function tabViec(D){
  var S=D.so_tay||{},V=D.viec||[],K=D.ket_luan||{},L=D.theo_doi||[];
  var h='<h2 class="top">Sổ tay thực thi</h2>';
  h+=S.da_sinh?'<div class="card"><b>'+num(S.so_ban,0)+' bản</b> đã sinh tại <code>'+
      esc(S.duong_dan)+'</code><div class="note" style="margin-top:6px">⛔ Sổ tay cá nhân phát riêng '+
      'từng người, ⛔ không đính kèm nhiều bản trong một file, ⛔ không gửi vào nhóm chat chung '+
      '(<code>id-I §7</code>).</div></div>'
    :'<div class="lock">Chưa sinh sổ tay. Duyệt ma trận rồi chạy <code>python tools/so_tay.py --ky …</code></div>';

  var bo=[['marketing','Marketing'],['truc_page','Trực page'],['he_thong','Hệ thống']];
  var co=bo.some(function(g){return (K[g[0]]||[]).length});
  if(co){
    h+='<h2>Kết luận kỳ — việc trọng tâm mỗi bộ phận</h2><div class="g3">'+bo.map(function(g){
      var arr=K[g[0]]||[];
      return '<div class="card"><h3>'+g[1]+'</h3>'+(arr.length?'<ol class="plain">'+arr.map(function(v){
        return '<li><b>'+esc(v.viec)+'</b>'+(v.ly_do?'<div class="note">'+esc(v.ly_do)+'</div>':'')+
          (v.so_huu?'<div class="note">Người làm: '+esc(v.so_huu)+'</div>':'')+
          (v.do_ky_sau?'<div class="note">Đo kỳ sau: '+esc(v.do_ky_sau)+'</div>':'')+
          chip(NHAN,v.nhan)+'</li>'}).join('')+'</ol>':'<div class="note">Không có việc trọng tâm kỳ này.</div>')+
        '</div>'}).join('')+'</div>';
  }

  h+='<h2>Việc cần xử lý — '+num(V.length,0)+' việc</h2>';
  h+=V.length?t(V.map(function(r){
      var st={moi:['mới',''],dang:['đang làm','t-mid'],dat:['đạt','t-ok'],chua:['chưa đạt','t-bad']}[r.trang_thai]||[r.trang_thai||'—',''];
      return '<tr>'+td(num(r.so,0),'n')+td('<b>'+esc(r.viec)+'</b>')+td(esc(r.bo_phan))+
        td(r.so_huu?esc(r.so_huu):'<span class="tag t-bad">chưa có người</span>')+td(esc(r.han||'—'))+
        td(esc(r.do_the_nao||'—'))+td('<span class="tag '+st[1]+'">'+st[0]+'</span>')+'</tr>'}),
      [{l:'#',c:'n'},{l:'Việc'},{l:'Bộ phận'},{l:'Sở hữu'},{l:'Hạn'},{l:'Đo thế nào'},{l:'Trạng thái'}])
    :'<div class="card empty">Agent chưa ghi việc nào. Việc không có tên người là việc không ai làm.</div>';

  if(L.length)h+='<h2>Theo dõi việc kỳ trước</h2>'+t(L.map(function(r){
    var s=r.dat===true?['đạt','t-ok']:(r.dat===false?['chưa đạt','t-bad']:['chưa đo','']);
    return '<tr>'+td(esc(r.bo_phan))+td(esc(r.viec))+td(esc(r.muc_tieu))+td(esc(r.ket_qua))+
      td('<span class="tag '+s[1]+'">'+s[0]+'</span>'+
        (r.lan>=2&&r.dat===false?' <span class="tag t-bad">2 kỳ — đẩy BU</span>':''))+'</tr>'}),
    [{l:'Bộ phận'},{l:'Việc'},{l:'Mục tiêu'},{l:'Kết quả kỳ này'},{l:'Trạng thái'}]);
  return h}

/* ───────── ⑨ Ghi chú dữ liệu ───────── */
function tabGhiChu(D){
  return '<h2 class="top">Ghi chú dữ liệu</h2>'+
    '<div class="note nb">Báo cáo không nói được số đến từ đâu thì không ai dám dùng để ra quyết định.</div>'+
    '<div class="card">'+bullets(D.ghi_chu)+'</div>'}

/* ───────── khung ───────── */
/* ───────── BỐ CỤC BÁO CÁO ─────────
   Một trang, nhiều bố cục. `data/index.json` khai `bo_cuc`; không khai thì ra bản
   ĐẦY ĐỦ 9 tab như cũ. Nhờ vậy tách được báo cáo cho từng người đọc mà
   ⛔ không phải đẻ thêm một bản trang nào — link cũ vẫn chạy. */
var BC='day-du';
var BO_CUC={
  'day-du':{ten:'Chân dung khách & chất lượng trực page · Kangnam',
    tab:['pheu','chan-dung','nhan-vien','facebook','google','ma-tran','hook','viec','ghi-chu']},
  // ⛔ Bố cục này KHÔNG có tab quảng cáo: đầu vào của nó là HỘI THOẠI.
  //    Số chi phí đến từ nguồn khác (id.py ads) và ở bản `day-du`.
  'insight':{ten:'Insight khách · line Da · Kangnam',
    phu:'Đọc từ chính lời khách — khách là ai · họ sợ gì · kỳ tới làm nội dung gì',
    tab:['pheu','chan-dung','ma-tran','hook'],
    the:['ht','bo_1','co_sdt','nong_chua_sdt']},
  'truc-page':{ten:'Chất lượng trực page · Kangnam',
    phu:'Khối đang yếu tiêu chí nào · ai cần kèm · tuần tới sửa câu nào',
    tab:['nhan-vien','pheu','chan-dung','viec','ghi-chu'],
    the:['ht','sla','roi_truc','bo_1','nong_chua_sdt'],
    nhan:{'pheu':'Khách rơi ở đâu','chan-dung':'Khách là ai · câu mở mẫu'}}
};
function bc(){return BO_CUC[BC]||BO_CUC['day-du']}
function tabDs(){var L=bc();            // ★ giữ ĐÚNG thứ tự khai trong bố cục,
  return L.tab.map(function(id){        //   không theo thứ tự của TABS
    var x=find(TABS.map(function(t){return {id:t[0],t:t}}),'id',id);
    return x?[id,(L.nhan&&L.nhan[id])||x.t[1],x.t[2]]:null}).filter(Boolean)}

var TABS=[['pheu','Phễu inbox',tabPheu],['chan-dung','Chân dung & insight',tabChanDung],
  ['nhan-vien','Chấm điểm nhân viên',tabNhanVien],['facebook','Facebook Ads',tabFacebook],
  ['google','Google Ads',tabGoogle],['ma-tran','Ma trận ưu tiên',tabMaTran],
  ['hook','Ngân hàng hook',tabHook],['viec','Sổ tay & việc',tabViec],
  ['ghi-chu','Ghi chú dữ liệu',tabGhiChu]];

function chonTab(id){
  app.querySelectorAll('.tabs button').forEach(function(b){
    b.setAttribute('aria-selected',String(b.dataset.p===id))});
  app.querySelectorAll('section[role=tabpanel]').forEach(function(p){p.hidden=(p.id!=='p-'+id)});
  try{localStorage.setItem('kn_tab_'+BC,id)}catch(e){}
}
function render(D,ky_ds,id){
  var DS=tabDs();
  var tab=(location.hash||'').replace('#','');
  try{if(!tab)tab=localStorage.getItem('kn_tab_'+BC)||''}catch(e){}
  if(!DS.some(function(x){return x[0]===tab}))tab=DS[0][0];
  var h=header(D,ky_ds,id)+canhBao(D)+theTong(D);
  h+='<div class="tabs" role="tablist">'+DS.map(function(x){
    return '<button role="tab" id="tab-'+x[0]+'" data-p="'+x[0]+'" aria-selected="'+
      (x[0]===tab)+'">'+esc(x[1])+'</button>'}).join('')+'</div>';
  DS.forEach(function(x){
    var body;
    try{body=x[2](D)}catch(e){body='<div class="card empty">Không dựng được phần này: '+esc(e.message)+'</div>'}
    h+='<section role="tabpanel" id="p-'+x[0]+'" aria-labelledby="tab-'+x[0]+'"'+
      (x[0]===tab?'':' hidden')+'>'+body+'</section>'});
  app.innerHTML=h;
  app.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){chonTab(b.dataset.p)})});
  var s=document.getElementById('ky-select');
  if(s)s.addEventListener('change',function(){napKy(ky_ds,s.value)});
  var hl=document.getElementById('hook-loc');
  if(hl){
    hl.addEventListener('change',locHook);
    var xo=document.getElementById('hook-xoa');
    if(xo)xo.addEventListener('click',function(){
      hl.querySelectorAll('select').forEach(function(q){q.value=''});locHook()});
  }
}
function loi(msg){app.innerHTML='<div class="card empty">'+esc(msg)+'</div>'}
function napKy(ds,id){
  var p=find(ds,'id',id)||ds[0];
  try{localStorage.setItem('kn_ky',p.id)}catch(e){}
  fetch(p.file).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(D){render(D,ds,p.id)})
    .catch(function(){loi('Không tải được dữ liệu kỳ '+esc(p.nhan)+' ('+esc(p.file)+
      '). File kỳ không nằm trong git — sinh lại bằng: python tools/id.py bao-cao --ky "'+
      esc(p.nhan)+'"')});
}
var inline=document.getElementById('kn-data').textContent.trim();
if(inline){try{render(JSON.parse(inline),null,null)}catch(e){loi('Khối dữ liệu trong file bị lỗi: '+e.message)}}
else fetch('data/index.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(idx){
    if(idx.bo_cuc&&BO_CUC[idx.bo_cuc])BC=idx.bo_cuc;
    try{document.title=bc().ten}catch(e){}
    var ds=idx.ky||[];
    if(!ds.length){loi('Chưa có kỳ báo cáo nào. Chạy: python tools/id.py bao-cao --ky "19-25/10"');return}
    var want=null; try{want=localStorage.getItem('kn_ky')}catch(e){}
    napKy(ds,find(ds,'id',want)?want:ds[0].id)})
  .catch(function(){loi('Không tải được danh sách kỳ báo cáo. Chạy: python tools/id.py bao-cao --ky …')});
})();
</script>
